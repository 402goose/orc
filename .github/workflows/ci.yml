name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck orc hud.sh install.sh build.sh test/run.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify orc is assembled from hud.sh
        run: |
          ./build.sh
          git diff --exit-code orc
      - name: run tests
        run: ./test/run.sh
