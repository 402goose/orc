# Fly app config for the Fusion opt-in telemetry ingestion endpoint.
# Deploy: fly launch --no-deploy (first time, to create the app) then
# fly deploy from this directory. See README.md in this directory for the
# full setup including Postgres attach and secrets.
app = "orc-telemetry"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
